[package]
name = "underway"
description = "⏳ Durable step functions via Postgres"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["background-jobs", "job-queue", "work-queue", "sqlx", "web"]
categories = ["asynchronous", "database", "web-programming"]
repository = "https://github.com/maxcountryman/underway"
documentation = "https://docs.rs/underway"

[dependencies]
jiff-cron = "0.1.1"
jiff = { version = "0.1.29", features = ["serde"] }
serde = "1.0.228"
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = [
  "postgres",
  "runtime-tokio-rustls",
  "uuid",
  "json",
] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
  "full",
] } # TODO: "full" shouldn't be required
tracing = { version = "0.1.41", features = ["log"] }
ulid = { version = "1.2.1", features = ["uuid"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
num_cpus = "1.17.0"
tokio-util = "0.7.17"

[dev-dependencies]
futures = "0.3.31"
tokio = { version = "1.48.0", features = ["test-util"] }
